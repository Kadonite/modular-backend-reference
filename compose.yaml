services:
  postgres:
    image: postgres:17-alpine
    container_name: modular-backend-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE:-modular_backend}
      POSTGRES_USER: ${DB_USERNAME:-modular_backend}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-modular_backend} -d ${DB_DATABASE:-modular_backend}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
